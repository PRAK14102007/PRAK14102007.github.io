<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>Admin — Prakhar Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="admin-page"><main class="admin-shell"><a class="back-link" href="index.html">← VIEW PORTFOLIO</a><section class="admin-card" id="loginCard"><div class="studio-kicker">PRIVATE AREA</div><h1>Admin<br><span>Studio.</span></h1><p>Only your authenticated account can publish or delete projects. Visitors never see these controls.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="your email"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="publish" type="submit">SIGN IN ↗</button><div class="admin-message" id="loginMessage"></div></form></section><section class="admin-card hidden" id="dashboard"><div class="dash-head"><div><div class="studio-kicker">AUTHENTICATED</div><h1>Your<br><span>Projects.</span></h1></div><button class="signout" id="signOut">SIGN OUT</button></div><form id="projectForm"><label class="upload-zone" for="projectImage"><input id="projectImage" type="file" accept="image/*" required><span id="uploadText">＋ Choose project image</span></label><div class="form-grid"><label>Project name<input id="projectTitle" required placeholder="e.g. Festival Poster"></label><label>Year<input id="projectYear" value="2026" required></label><label class="full">Category<select id="projectCategory"><option>Graphic Design</option><option>Cultural Poster</option><option>Event Identity</option><option>Illustration</option><option>Certificate Design</option><option>Experimental Art</option></select></label><label class="full">Short description<textarea id="projectDesc" rows="3" placeholder="What was the idea behind it?"></textarea></label></div><button class="publish" type="submit">PUBLISH PROJECT <span>↗</span></button><div class="admin-message" id="projectMessage"></div></form><div class="admin-projects"><div class="studio-kicker">PUBLISHED PROJECTS</div><div id="adminList"></div></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
